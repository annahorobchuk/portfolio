<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protected — Anna Horobchuk</title>
  <meta name="description" content="Password-protected case study.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=3">
</head>
<body class="gate-page">

  <header class="site-nav">
    <div class="wrap site-nav__inner">
      <span class="status-badge">
        <span class="status-badge__dot" aria-hidden="true"></span>
        Available for New Project
      </span>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
        <span class="sr-only">Toggle menu</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <nav>
        <ul class="nav-links" id="nav-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../about.html">About</a></li>
          <li><a href="../experiments.html">Experiments</a></li>
          <li><a href="../contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="gate">
      <div class="wrap gate__inner">
        <div class="gate__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="12" cy="15" r="1.3" fill="currentColor"/>
          </svg>
        </div>

        <h1 class="gate__title">This content is protected.</h1>
        <p class="gate__subtitle">To view, please enter the password.</p>

        <form class="gate__form" id="gate-form" novalidate>
          <input
            type="password"
            id="gate-password"
            class="gate__input"
            placeholder="Enter password"
            autocomplete="off"
            autofocus
          >
          <button type="submit" class="gate__submit" aria-label="Submit password">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 12h16m0 0-6-6m6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        <p class="gate__error" id="gate-error" role="alert"></p>
      </div>
    </section>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
